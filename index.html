<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveloop – Personalized Travel Planning Made Easy</title>
  <meta name="description" content="Plan your perfect multi-city trip with Traveloop. Create itineraries, track budgets, explore cities and activities, and share your adventures." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens.css" />
</head>
<body>
  <!-- Animated background -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app-shell">
    <!-- Sidebar Nav (hidden on auth screens) -->
    <aside id="sidebar" class="sidebar hidden">
      <div class="sidebar-logo">
        <span class="logo-icon">✈️</span>
        <span class="logo-text">Traveloop</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item" data-screen="dashboard" id="nav-dashboard" onclick="event.preventDefault(); App.navigate('dashboard')">
          <span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-screen="trips" id="nav-trips" onclick="event.preventDefault(); App.navigate('trips')">
          <span class="nav-icon">🗺️</span><span class="nav-label">My Trips</span>
        </a>
        <a href="#" class="nav-item" data-screen="create-trip" id="nav-create" onclick="event.preventDefault(); App.navigate('create-trip')">
          <span class="nav-icon">➕</span><span class="nav-label">New Trip</span>
        </a>
        <a href="#" class="nav-item" data-screen="city-search" id="nav-cities" onclick="event.preventDefault(); App.navigate('city-search')">
          <span class="nav-icon">🏙️</span><span class="nav-label">Explore Cities</span>
        </a>
        <a href="#" class="nav-item" data-screen="activity-search" id="nav-activities" onclick="event.preventDefault(); App.navigate('activity-search')">
          <span class="nav-icon">🎯</span><span class="nav-label">Activities</span>
        </a>
        <a href="#" class="nav-item" data-screen="admin" id="nav-admin" onclick="event.preventDefault(); App.navigate('admin')">
          <span class="nav-icon">📊</span><span class="nav-label">Analytics</span>
        </a>
      </nav>
      <div class="sidebar-bottom">
        <a href="#" class="nav-item" data-screen="profile" id="nav-profile" onclick="event.preventDefault(); App.navigate('profile')">
          <span class="nav-icon">👤</span><span class="nav-label">Profile</span>
        </a>
        <a href="#" class="nav-item" id="nav-logout" onclick="App.logout()">
          <span class="nav-icon">🚪</span><span class="nav-label">Logout</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Top bar -->
      <header id="topbar" class="topbar hidden">
        <button class="hamburger" id="hamburger" onclick="App.toggleSidebar()">☰</button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-actions">
          <div class="user-avatar" id="topbar-avatar">U</div>
        </div>
      </header>

      <!-- Screen Container -->
      <div id="screen-container" class="screen-container">
        <!-- Screens are rendered here by JS -->
      </div>
    </main>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box">
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/trips.js"></script>
  <script src="js/screens/create-trip.js"></script>
  <script src="js/screens/itinerary-builder.js"></script>
  <script src="js/screens/itinerary-view.js"></script>
  <script src="js/screens/city-search.js"></script>
  <script src="js/screens/activity-search.js"></script>
  <script src="js/screens/budget.js"></script>
  <script src="js/screens/packing.js"></script>
  <script src="js/screens/shared.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/notes.js"></script>
  <script src="js/screens/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
